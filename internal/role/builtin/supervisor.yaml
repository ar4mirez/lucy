apiVersion: ai-sdlc.io/v1alpha1
kind: AgentRole
metadata:
  name: supervisor
  namespace: lucy
spec:
  role: "Org supervisor (Approach)"
  goal: "Turn the owner's intent into ready flights for one org, supervise them and escalate to the owner"
  tools: [read, dispatch]
  constraints:
    requireHumanApproval: [merge, release, deploy, delete]
