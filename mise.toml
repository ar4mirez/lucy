# Toolchain for working on lucy. Install with `mise install`.
[tools]
go = "1.27.4"

[env]
# Shared build hosts: keep parallel compile jobs low.
GOFLAGS = "-p=2"

[tasks.check]
description = "Format check, vet, race tests and doc rules (what CI runs)"
run = [
  "test -z \"$(gofmt -l .)\" || { gofmt -l .; echo 'gofmt: files above need formatting'; exit 1; }",
  "go vet ./...",
  "go test -race ./...",
]

[tasks.conformance]
description = "Run the conformance corpus: every scenario, with what each pending one waits for"
run = "go test -race -count=1 -run 'TestConformance|TestCorpusWellFormed|TestHarnessCatchesViolations' -v ./internal/corpus"

[tasks.conformance-doc]
description = "Regenerate docs/security/conformance.md from the corpus"
run = "go test ./internal/corpus -run TestCoverageDoc -update"

[tasks.docs-index]
description = "Regenerate docs/requirements.md from the PRD tables"
run = "go test ./internal/doccheck -run TestRequirementsIndex -update"

[tasks.api-schema]
description = "Regenerate internal/api/openrpc.json from the API's method table"
run = "go test ./internal/api -run TestOpenRPCDocument -update"

[tasks.build]
description = "Build ./bin/lucy with a version stamp"
run = "go build -ldflags \"-X main.version=${LUCY_VERSION:-dev}\" -o bin/lucy ./cmd/lucy"

[tasks.security]
description = "lucy's own security scans for this OS, as CI's security workflow runs them"
run = [
  "go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...",
  "go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -quiet ./...",
  "go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --exit-code 1 .",
]
